on:
  push:
    branches:
      - joss-paper
      - main
  
jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: TeX and PDF
        uses: docker://openjournals/paperdraft:latest
        with:
          journal: joss
          paper-path: joss/paper.md
          args: '-k paper/paper.md'
        env:
          GIT_SHA: $GITHUB_SHA
          JOURNAL: joss
      - name: Upload
        uses: actions/upload-artifact@v1
        with:
          name: paper
          path: joss/paper.pdf
